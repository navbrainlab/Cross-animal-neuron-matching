[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mprt-net"
version = "0.1.1"
description = "Multimodal Population-Relational Transport for cross-animal neuron matching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
eval = ["scipy>=1.10"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mprt_net*"]

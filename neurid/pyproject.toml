[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurid"
version = "1.0.0"
description = "NeuRID: multimodal cross-animal neuron identity matching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
eval = ["scipy>=1.10", "pycpd>=2.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mprt_net*"]
